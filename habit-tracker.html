<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Geist:wght@300..600&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-surface: rgba(255, 255, 255, 0.03);
    --bg-hover: rgba(255, 255, 255, 0.055);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text-1: rgba(255, 255, 255, 0.94);
    --text-2: rgba(255, 255, 255, 0.55);
    --text-3: rgba(255, 255, 255, 0.32);
    --accent-done: #FF8C42;
    --accent-streak: #FFA94D;
    --dot: rgba(255, 255, 255, 0.085);
    --danger: #E06C75;
  }

  html, body {
    background: #191919;
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    color: var(--text-1);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px 20px;
    max-width: 560px;
    margin: 8px auto;
    position: relative;
  }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
  .header-left { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }

  .date {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 26px;
    font-style: italic;
    letter-spacing: -0.01em;
  }

  .progress-text {
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    color: var(--text-2);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .settings-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .settings-btn:hover { background: var(--bg-hover); color: var(--text-1); border-color: var(--border-strong); }
  .settings-btn.open { background: var(--bg-hover); color: var(--text-1); }

  .settings-panel {
    position: absolute;
    top: 60px; right: 20px;
    background: #232323;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 4px;
    min-width: 220px;
    z-index: 20;
    display: none;
    flex-direction: column;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .settings-panel.open { display: flex; }
  .settings-item {
    padding: 9px 12px;
    background: transparent;
    border: none;
    color: var(--text-1);
    font-family: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.1s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .settings-item:hover { background: var(--bg-hover); }
  .settings-item.danger { color: var(--danger); }
  .settings-item.danger:hover { background: rgba(224, 108, 117, 0.1); }
  .settings-item.confirming { background: var(--danger); color: #1a1a1a; font-weight: 500; }

  .progress-bar { height: 4px; background: var(--dot); border-radius: 2px; overflow: hidden; margin-bottom: 22px; }
  .progress-fill { height: 100%; background: var(--accent-done); border-radius: 2px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

  .habits { display: flex; flex-direction: column; }

  .habit {
    display: grid;
    grid-template-columns: 22px 1fr auto 48px 18px;
    gap: 14px;
    align-items: center;
    padding: 11px 12px;
    margin: 0 -12px;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .habit:hover { background: var(--bg-hover); }

  .check {
    width: 22px; height: 22px; border-radius: 7px;
    border: 1.5px solid var(--border-strong);
    transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer;
  }
  .habit.done .check, .modal-habit.done .check { background: var(--accent-done); border-color: var(--accent-done); }
  .check svg {
    width: 12px; height: 12px;
    stroke: #0E0E0E; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    fill: none; opacity: 0; transform: scale(0.6);
    transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.5, 1.6, 0.4, 1);
  }
  .habit.done .check svg, .modal-habit.done .check svg { opacity: 1; transform: scale(1); }

  .habit-name {
    font-size: 15px; font-weight: 400; color: var(--text-1);
    transition: color 0.15s ease;
    cursor: text;
    padding: 2px 6px; margin: -2px -6px;
    border-radius: 4px; outline: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .habit-name:focus { background: rgba(255,255,255,0.06); white-space: normal; }
  .habit.done .habit-name { color: var(--text-2); }

  .strip { display: flex; gap: 3px; }
  .strip-day {
    width: 6px; height: 14px; border-radius: 2px;
    background: var(--dot); transition: background 0.2s ease;
  }
  .strip-day.done { background: var(--accent-done); opacity: 0.72; }
  .strip-day.today:not(.done) { border: 1px solid var(--text-3); }

  .streak {
    font-family: 'Geist Mono', monospace; font-size: 13px;
    color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 3px; justify-content: flex-end;
  }
  .streak.active { color: var(--accent-streak); }

  .delete-btn {
    width: 18px; height: 18px; border-radius: 4px;
    background: transparent; border: none; color: var(--text-3);
    cursor: pointer; opacity: 0.35;
    transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease;
    display: flex; align-items: center; justify-content: center;
    padding: 0; font-family: inherit; font-size: 18px; line-height: 1;
  }
  .habit:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { color: var(--danger); background: rgba(224, 108, 117, 0.12); }
  .delete-btn.confirming { background: var(--danger); color: #1a1a1a; opacity: 1; font-size: 14px; font-weight: 600; }

  .add-btn {
    display: flex; align-items: center; gap: 14px;
    width: calc(100% + 24px);
    padding: 10px 12px; margin: 4px -12px 0;
    background: transparent; border: none;
    color: var(--text-3);
    font-size: 14px; font-family: inherit;
    cursor: pointer; border-radius: 8px;
    transition: all 0.15s ease; text-align: left;
  }
  .add-btn:hover { background: var(--bg-hover); color: var(--text-2); }
  .add-btn .plus {
    width: 22px; height: 22px; border-radius: 7px;
    border: 1.5px dashed var(--border-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--text-3);
  }

  .add-input-wrap {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; margin: 4px -12px 0;
  }
  .add-input-wrap input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 7px 10px;
    color: var(--text-1); font-family: inherit; font-size: 14px;
    outline: none; transition: border-color 0.15s;
  }
  .add-input-wrap input:focus { border-color: var(--accent-done); }
  .add-input-wrap button {
    background: transparent; border: none;
    color: var(--text-2); cursor: pointer;
    padding: 6px 10px; font-family: inherit; font-size: 13px;
    border-radius: 4px; transition: all 0.15s;
  }
  .add-input-wrap button.confirm { color: var(--accent-done); font-weight: 500; }
  .add-input-wrap button:hover { background: rgba(255,255,255,0.05); }

  .section { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
  .section-label {
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px; color: var(--text-3);
    letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .section-stat { color: var(--text-2); font-variant-numeric: tabular-nums; }

  .chart { display: flex; align-items: flex-end; gap: 3px; height: 64px; margin-bottom: 8px; }
  .chart-bar {
    flex: 1; min-height: 2px;
    background: var(--dot);
    border-radius: 2px 2px 0 0;
    position: relative;
    transition: opacity 0.15s ease, background 0.2s ease;
    cursor: pointer;
  }
  .chart-bar.has-data { background: var(--accent-done); opacity: 0.5; }
  .chart-bar.has-data.partial-high { opacity: 0.75; }
  .chart-bar.has-data.full { opacity: 1; }
  .chart-bar.today { box-shadow: inset 0 -2px 0 var(--accent-streak); }
  .chart-bar:hover { opacity: 1 !important; }
  .chart-bar:hover::after {
    content: attr(data-tooltip);
    position: absolute; bottom: calc(100% + 6px); left: 50%;
    transform: translateX(-50%);
    background: #2A2A2A; color: var(--text-1);
    font-family: 'Geist Mono', monospace;
    font-size: 11px; padding: 5px 8px; border-radius: 4px;
    white-space: nowrap; pointer-events: none;
    border: 1px solid var(--border-strong); z-index: 10;
  }
  .chart-axis {
    display: flex; justify-content: space-between;
    font-family: 'Geist Mono', monospace;
    font-size: 10px; color: var(--text-3); letter-spacing: 0.05em;
  }

  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .weekday {
    text-align: center; font-size: 10px;
    color: var(--text-3);
    font-family: 'Geist Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 2px 0 6px;
  }
  .day-cell {
    aspect-ratio: 1;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--dot);
    font-size: 11px;
    color: var(--text-3);
    transition: transform 0.1s, background 0.2s;
    font-variant-numeric: tabular-nums;
    font-family: 'Geist Mono', monospace;
    position: relative;
  }
  .day-cell.empty { background: transparent; }
  .day-cell.future { background: rgba(255,255,255,0.04); color: var(--text-3); opacity: 0.5; }
  .day-cell.partial { background: rgba(255, 140, 66, calc(var(--pct, 0) * 0.7 + 0.15)); color: rgba(255,255,255,0.9); }
  .day-cell.full { background: var(--accent-done); color: #1a1a1a; font-weight: 500; }
  .day-cell.today { outline: 1.5px solid var(--accent-streak); outline-offset: -1px; }
  .day-cell:not(.future):not(.empty) { cursor: pointer; }
  .day-cell:not(.future):not(.empty):hover { transform: scale(1.12); z-index: 2; }

  .footer {
    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between;
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px; color: var(--text-3);
    letter-spacing: 0.06em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    flex-wrap: wrap; gap: 8px;
  }
  .footer span { white-space: nowrap; }

  .empty { text-align: center; padding: 16px 0; color: var(--text-3); font-size: 13px; }

  /* Backfill modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #1F1F1F;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 20px;
    max-width: 380px; width: 100%;
    max-height: 80vh; overflow-y: auto;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header span {
    font-family: 'Fraunces', serif;
    font-size: 18px; font-style: italic;
  }
  .modal-close {
    width: 26px; height: 26px; border-radius: 4px;
    background: transparent; border: none; color: var(--text-2);
    cursor: pointer; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .modal-close:hover { background: var(--bg-hover); color: var(--text-1); }
  .modal-habits { display: flex; flex-direction: column; }
  .modal-habit {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 12px; align-items: center;
    padding: 10px; margin: 0 -10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .modal-habit:hover { background: var(--bg-hover); }
  .modal-habit .habit-name {
    font-size: 14px; cursor: default;
    padding: 0; margin: 0;
  }

  /* Celebration */
  .celebration {
    position: fixed; inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 100;
    display: none;
  }
  .celebration.active { display: block; }
  .confetti-piece {
    position: absolute;
    top: -20px;
    width: 8px; height: 14px;
    border-radius: 2px;
    animation: confetti-fall linear forwards;
    opacity: 0;
  }
  @keyframes confetti-fall {
    0% { opacity: 1; transform: translateY(0) rotate(0); }
    100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
  }
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: #232323;
    border: 1px solid var(--accent-done);
    color: var(--text-1);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .card { padding: 18px 16px 16px; margin: 4px auto; border-radius: 12px; }
    .date { font-size: 22px; }
    .progress-bar { margin-bottom: 18px; }
    .habit {
      grid-template-columns: 22px 1fr auto 18px;
      gap: 12px; padding: 10px; margin: 0 -10px;
    }
    .strip { display: none; }
    .habit-name { font-size: 14.5px; }
    .add-btn { gap: 12px; padding: 10px; margin: 4px -10px 0; }
    .add-input-wrap { padding: 10px; margin: 4px -10px 0; gap: 6px; }
    .section { margin-top: 18px; padding-top: 14px; }
    .chart { height: 56px; }
    .footer { font-size: 9.5px; letter-spacing: 0.04em; }
    .delete-btn { opacity: 0.5; }
    .settings-panel { right: 16px; top: 56px; min-width: 200px; }
    .day-cell { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-left">
      <div class="date" id="date">—</div>
      <div class="progress-text" id="progress-text">0 / 0</div>
    </div>
    <button class="settings-btn" id="settings-btn" aria-label="Einstellungen">⚙</button>
  </div>
  <div class="settings-panel" id="settings-panel">
    <button class="settings-item" data-action="export">📤 Daten exportieren</button>
    <button class="settings-item" data-action="import">📥 Daten importieren</button>
    <button class="settings-item danger" data-action="reset">🗑 Alle Daten zurücksetzen</button>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="habits" id="habits"></div>
  <div id="add-habit-row"></div>

  <div class="section">
    <div class="section-label">
      <span>Letzte 30 Tage</span>
      <span class="section-stat" id="chart-stats">Ø 0%</span>
    </div>
    <div class="chart" id="chart"></div>
    <div class="chart-axis">
      <span>vor 30 Tagen</span>
      <span>heute · klick = nachholen</span>
    </div>
  </div>

  <div class="section">
    <div class="section-label">
      <span id="month-label">—</span>
      <span class="section-stat" id="month-stats">— %</span>
    </div>
    <div class="month-grid" id="month-grid"></div>
  </div>

  <div class="footer">
    <span id="streak-stat">Streak: —</span>
    <span id="weeks-stat">🏆 0 Wochen</span>
    <span id="best-stat">Best: —</span>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <span id="modal-date">—</span>
      <button class="modal-close" id="modal-close" aria-label="Schließen">×</button>
    </div>
    <div class="modal-habits" id="modal-habits"></div>
  </div>
</div>

<div class="celebration" id="celebration"></div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'habit-tracker-v2';
const DEFAULT_HABITS = [
  { id: 'reinigen', name: 'Reinigen' },
  { id: 'duolingo', name: 'Duolingo' },
  { id: 'gym',      name: 'Sport / Gym' },
  { id: 'udemy',    name: '15 min Udemy' }
];

const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const dateKey = (date = new Date()) =>
  date.getFullYear() + '-' +
  String(date.getMonth() + 1).padStart(2, '0') + '-' +
  String(date.getDate()).padStart(2, '0');

const formatDate = (date = new Date(), withWeekday = true) =>
  date.toLocaleDateString('de-DE', withWeekday
    ? { weekday: 'long', day: 'numeric', month: 'long' }
    : { day: 'numeric', month: 'long' });

const slugify = (name) => {
  const base = name.toLowerCase()
    .replace(/[äöüß]/g, c => ({ä:'ae',ö:'oe',ü:'ue',ß:'ss'}[c]))
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return base || ('h-' + Date.now());
};

let data = (() => {
  try {
    const v2 = localStorage.getItem(STORAGE_KEY);
    if (v2) return JSON.parse(v2);
    const v1 = localStorage.getItem('habit-tracker-v1');
    if (v1) return { habits: DEFAULT_HABITS.slice(), history: JSON.parse(v1).history || {} };
  } catch (e) {}
  return { habits: DEFAULT_HABITS.slice(), history: {} };
})();

const saveData = () => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
};

const validIdSet = () => new Set(data.habits.map(h => h.id));

const isDone = (habitId, key = dateKey()) =>
  (data.history[key] || []).includes(habitId);

const toggle = (habitId, key = dateKey()) => {
  if (!data.history[key]) data.history[key] = [];
  const idx = data.history[key].indexOf(habitId);
  if (idx === -1) data.history[key].push(habitId);
  else data.history[key].splice(idx, 1);
  if (data.history[key].length === 0) delete data.history[key];
  saveData();
};

const addHabit = (name) => {
  name = (name || '').trim();
  if (!name) { renderAddRow(); return; }
  let id = slugify(name);
  if (data.habits.find(h => h.id === id)) id = id + '-' + Date.now();
  data.habits.push({ id, name });
  saveData();
  render();
};

const removeHabit = (id) => {
  data.habits = data.habits.filter(h => h.id !== id);
  Object.keys(data.history).forEach(k => {
    data.history[k] = data.history[k].filter(hId => hId !== id);
    if (data.history[k].length === 0) delete data.history[k];
  });
  saveData();
  render();
};

const renameHabit = (id, newName) => {
  newName = (newName || '').trim();
  if (!newName) return false;
  const h = data.habits.find(h => h.id === id);
  if (h) { h.name = newName; saveData(); return true; }
  return false;
};

const calcStreak = (habitId) => {
  let streak = 0;
  let d = new Date();
  if (!isDone(habitId, dateKey(d))) d.setDate(d.getDate() - 1);
  while (isDone(habitId, dateKey(d))) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
};

const last7Days = (habitId) => {
  const arr = [];
  for (let i = 6; i >= 0; i--) {
    const day = new Date();
    day.setDate(day.getDate() - i);
    arr.push({ done: isDone(habitId, dateKey(day)), today: i === 0 });
  }
  return arr;
};

const last30DayStats = () => {
  const arr = [];
  const total = data.habits.length;
  const valid = validIdSet();
  for (let i = 29; i >= 0; i--) {
    const day = new Date();
    day.setDate(day.getDate() - i);
    const key = dateKey(day);
    const done = (data.history[key] || []).filter(id => valid.has(id)).length;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    arr.push({
      key, done, total, pct,
      today: i === 0,
      label: day.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })
    });
  }
  return arr;
};

const calcPerfectWeeks = () => {
  if (data.habits.length === 0) return 0;
  const valid = validIdSet();
  const today = new Date(); today.setHours(0,0,0,0);
  // Find Monday of the most recent COMPLETED week (i.e. last week's Monday)
  let monday = new Date(today);
  const dow = (monday.getDay() + 6) % 7;
  monday.setDate(monday.getDate() - dow - 7);
  let weeks = 0;
  while (true) {
    let perfect = true;
    for (let i = 0; i < 7; i++) {
      const day = new Date(monday);
      day.setDate(monday.getDate() + i);
      const done = (data.history[dateKey(day)] || []).filter(id => valid.has(id)).length;
      if (done < data.habits.length) { perfect = false; break; }
    }
    if (perfect) { weeks++; monday.setDate(monday.getDate() - 7); }
    else break;
  }
  return weeks;
};

const monthData = () => {
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startOffset = (firstDay.getDay() + 6) % 7;
  const valid = validIdSet();
  const total = data.habits.length;
  const days = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const day = new Date(year, month, d);
    const key = dateKey(day);
    const done = (data.history[key] || []).filter(id => valid.has(id)).length;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    days.push({
      day: d, key, done, total, pct,
      isToday: day.toDateString() === today.toDateString(),
      isFuture: day > today && !(day.toDateString() === today.toDateString())
    });
  }
  return { year, month, startOffset, days,
    label: today.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }) };
};

function renderAddRow() {
  const row = document.getElementById('add-habit-row');
  row.innerHTML = `
    <button class="add-btn" id="add-trigger">
      <span class="plus">+</span>
      <span>Habit hinzufügen</span>
    </button>
  `;
  document.getElementById('add-trigger').addEventListener('click', () => {
    row.innerHTML = `
      <div class="add-input-wrap">
        <input type="text" id="new-habit-name" placeholder="Name des Habits…" maxlength="40" autocomplete="off">
        <button class="confirm" id="add-confirm">Hinzufügen</button>
        <button id="add-cancel">Abbrechen</button>
      </div>
    `;
    const input = document.getElementById('new-habit-name');
    input.focus();
    const submit = () => addHabit(input.value);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      else if (e.key === 'Escape') renderAddRow();
    });
    document.getElementById('add-confirm').addEventListener('click', submit);
    document.getElementById('add-cancel').addEventListener('click', renderAddRow);
  });
}

let lastTodayDone = -1;
const checkCelebration = () => {
  const valid = validIdSet();
  const todayList = (data.history[dateKey()] || []).filter(id => valid.has(id));
  const total = data.habits.length;
  const done = todayList.length;
  if (total > 0 && done === total && lastTodayDone < total && lastTodayDone >= 0) {
    triggerCelebration();
  }
  lastTodayDone = done;
};

const triggerCelebration = () => {
  const c = document.getElementById('celebration');
  c.innerHTML = '';
  const colors = ['#FF8C42', '#FFA94D', '#FFD166', '#6FCF73', '#5DA9E9'];
  for (let i = 0; i < 70; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.4) + 's';
    piece.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
    piece.style.width = (6 + Math.random() * 4) + 'px';
    piece.style.height = (10 + Math.random() * 6) + 'px';
    c.appendChild(piece);
  }
  c.classList.add('active');
  showToast('🎉 Perfekter Tag!');
  setTimeout(() => c.classList.remove('active'), 3200);
};

const showToast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
};

// Backfill modal
let backfillKey = null;
const openBackfill = (key) => {
  backfillKey = key;
  renderModal();
  document.getElementById('modal-backdrop').classList.add('open');
};
const closeModal = () => {
  document.getElementById('modal-backdrop').classList.remove('open');
  backfillKey = null;
};
const toggleBackfill = (habitId) => {
  if (!backfillKey) return;
  toggle(habitId, backfillKey);
  renderModal();
  render();
};

function renderModal() {
  if (!backfillKey) return;
  const [y, m, d] = backfillKey.split('-').map(Number);
  const dateObj = new Date(y, m - 1, d);
  document.getElementById('modal-date').textContent = formatDate(dateObj);
  const list = document.getElementById('modal-habits');
  list.innerHTML = '';
  if (data.habits.length === 0) {
    list.innerHTML = '<div class="empty">Keine Habits.</div>';
    return;
  }
  data.habits.forEach(h => {
    const done = (data.history[backfillKey] || []).includes(h.id);
    const row = document.createElement('div');
    row.className = 'modal-habit' + (done ? ' done' : '');
    row.innerHTML = `
      <div class="check"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
      <div class="habit-name">${esc(h.name)}</div>
    `;
    row.addEventListener('click', () => toggleBackfill(h.id));
    list.appendChild(row);
  });
}

// Settings
const toggleSettings = (force) => {
  const panel = document.getElementById('settings-panel');
  const btn = document.getElementById('settings-btn');
  const open = force !== undefined ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  btn.classList.toggle('open', open);
};

const exportData = () => {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `habits-backup-${dateKey()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup heruntergeladen');
  toggleSettings(false);
};

const importData = () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!imported.habits || !imported.history) {
          showToast('Ungültige Datei');
          return;
        }
        data = imported;
        saveData();
        render();
        showToast('Daten importiert');
      } catch (e) {
        showToast('Fehler beim Lesen');
      }
    };
    reader.readAsText(file);
  };
  input.click();
  toggleSettings(false);
};

const handleSettingsClick = (e) => {
  const btn = e.target.closest('.settings-item');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'export') exportData();
  else if (action === 'import') importData();
  else if (action === 'reset') {
    if (btn.classList.contains('confirming')) {
      data = { habits: DEFAULT_HABITS.slice(), history: {} };
      saveData();
      render();
      showToast('Daten zurückgesetzt');
      toggleSettings(false);
    } else {
      btn.classList.add('confirming');
      btn.textContent = 'Wirklich? Nochmal klicken';
      if (btn._timer) clearTimeout(btn._timer);
      btn._timer = setTimeout(() => {
        btn.classList.remove('confirming');
        btn.textContent = '🗑 Alle Daten zurücksetzen';
      }, 2500);
    }
  }
};

function render() {
  document.getElementById('date').textContent = formatDate();
  const valid = validIdSet();
  const todayList = (data.history[dateKey()] || []).filter(id => valid.has(id));
  const total = data.habits.length;
  const done = todayList.length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  document.getElementById('progress-text').textContent = `${done} / ${total}`;
  document.getElementById('progress-fill').style.width = pct + '%';

  // Habits
  const container = document.getElementById('habits');
  container.innerHTML = '';
  if (data.habits.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Noch keine Habits. Füg unten den ersten hinzu.';
    container.appendChild(empty);
  } else {
    data.habits.forEach(h => {
      const isd = isDone(h.id);
      const streak = calcStreak(h.id);
      const days = last7Days(h.id);
      const el = document.createElement('div');
      el.className = 'habit' + (isd ? ' done' : '');
      el.innerHTML = `
        <div class="check" data-action="toggle">
          <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
        </div>
        <div class="habit-name" contenteditable="true" spellcheck="false">${esc(h.name)}</div>
        <div class="strip">${days.map(d =>
          `<div class="strip-day${d.done ? ' done' : ''}${d.today ? ' today' : ''}"></div>`
        ).join('')}</div>
        <div class="streak${streak > 0 ? ' active' : ''}">${
          streak > 0 ? `<span>🔥</span>${streak}` : '—'
        }</div>
        <button class="delete-btn" data-action="delete" aria-label="Habit löschen">×</button>
      `;
      el.querySelector('[data-action="toggle"]').addEventListener('click', () => {
        toggle(h.id);
        render();
        checkCelebration();
      });
      const delBtn = el.querySelector('[data-action="delete"]');
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (delBtn.classList.contains('confirming')) removeHabit(h.id);
        else {
          delBtn.classList.add('confirming');
          delBtn.textContent = '✓';
          if (delBtn._timer) clearTimeout(delBtn._timer);
          delBtn._timer = setTimeout(() => {
            delBtn.classList.remove('confirming');
            delBtn.textContent = '×';
          }, 2500);
        }
      });
      const nameEl = el.querySelector('.habit-name');
      nameEl.addEventListener('blur', () => {
        const newName = nameEl.textContent.trim();
        if (newName && newName !== h.name) { renameHabit(h.id, newName); render(); }
        else nameEl.textContent = h.name;
      });
      nameEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); }
        if (e.key === 'Escape') { nameEl.textContent = h.name; nameEl.blur(); }
      });
      container.appendChild(el);
    });
  }

  // 30-day chart
  const stats = last30DayStats();
  const chart = document.getElementById('chart');
  chart.innerHTML = '';
  stats.forEach(s => {
    const bar = document.createElement('div');
    bar.className = 'chart-bar';
    if (s.pct > 0) bar.classList.add('has-data');
    if (s.pct >= 60 && s.pct < 100) bar.classList.add('partial-high');
    if (s.pct === 100) bar.classList.add('full');
    if (s.today) bar.classList.add('today');
    const h = s.pct > 0 ? Math.max(s.pct, 6) : 0;
    bar.style.height = h + '%';
    bar.setAttribute('data-tooltip', `${s.label}: ${s.done}/${s.total} (${s.pct}%)`);
    bar.addEventListener('click', () => openBackfill(s.key));
    chart.appendChild(bar);
  });
  const avg = stats.length > 0 ? Math.round(stats.reduce((a, s) => a + s.pct, 0) / stats.length) : 0;
  document.getElementById('chart-stats').textContent = `Ø ${avg}%`;

  // Month view
  const m = monthData();
  document.getElementById('month-label').textContent = m.label;
  const grid = document.getElementById('month-grid');
  grid.innerHTML = '';
  ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].forEach(d => {
    const h = document.createElement('div');
    h.className = 'weekday';
    h.textContent = d;
    grid.appendChild(h);
  });
  for (let i = 0; i < m.startOffset; i++) {
    const empty = document.createElement('div');
    empty.className = 'day-cell empty';
    grid.appendChild(empty);
  }
  let monthDoneDays = 0;
  m.days.forEach(d => {
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    if (d.isToday) cell.classList.add('today');
    if (d.isFuture) cell.classList.add('future');
    if (d.pct === 100) { cell.classList.add('full'); monthDoneDays++; }
    else if (d.pct > 0) cell.classList.add('partial');
    cell.style.setProperty('--pct', d.pct / 100);
    cell.textContent = d.day;
    if (!d.isFuture) {
      cell.addEventListener('click', () => openBackfill(d.key));
      cell.title = `${d.day}.: ${d.done}/${d.total} (${d.pct}%) — Klick zum Nachholen`;
    }
    grid.appendChild(cell);
  });
  document.getElementById('month-stats').textContent = `${monthDoneDays} perfekte Tage`;

  // Footer stats
  const bestStreak = Math.max(0, ...data.habits.map(h => calcStreak(h.id)));
  document.getElementById('streak-stat').textContent =
    bestStreak > 0 ? `Streak: ${bestStreak}` : 'Streak: —';

  const perfectWeeks = calcPerfectWeeks();
  document.getElementById('weeks-stat').textContent = `🏆 ${perfectWeeks} ${perfectWeeks === 1 ? 'Woche' : 'Wochen'}`;

  let best = { date: null, count: 0 };
  Object.entries(data.history).forEach(([k, list]) => {
    const c = list.filter(id => valid.has(id)).length;
    if (c > best.count) best = { date: k, count: c };
  });
  if (best.date) {
    const [, mm, dd] = best.date.split('-');
    document.getElementById('best-stat').textContent =
      `Best: ${parseInt(dd)}.${parseInt(mm)}. (${best.count}/${data.habits.length})`;
  } else {
    document.getElementById('best-stat').textContent = 'Best: —';
  }

  // Track today's done for celebration trigger
  if (lastTodayDone === -1) lastTodayDone = done;
}

// Wire up persistent listeners
document.getElementById('settings-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleSettings();
});
document.getElementById('settings-panel').addEventListener('click', handleSettingsClick);
document.addEventListener('click', (e) => {
  if (!e.target.closest('.settings-panel') && !e.target.closest('.settings-btn')) {
    toggleSettings(false);
  }
});
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
    toggleSettings(false);
  }
});

renderAddRow();
render();
setInterval(render, 60000);
</script>
</body>
</html>
