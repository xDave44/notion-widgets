<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Dos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Geist:wght@300..600&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-surface: rgba(255, 255, 255, 0.03);
    --bg-hover: rgba(255, 255, 255, 0.055);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text-1: rgba(255, 255, 255, 0.94);
    --text-2: rgba(255, 255, 255, 0.55);
    --text-3: rgba(255, 255, 255, 0.32);
    --accent-done: #FF8C42;
    --accent-streak: #FFA94D;
    --dot: rgba(255, 255, 255, 0.085);
    --danger: #E06C75;
    --sync-online: #6FCF73;
    --sync-offline: #E06C75;
    --prio-high: #E06C75;
    --prio-medium: #FF8C42;
    --prio-low: rgba(255, 255, 255, 0.28);
  }

  html, body {
    background: #191919;
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    color: var(--text-1);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px 20px;
    max-width: 560px;
    margin: 8px auto;
    position: relative;
  }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px; gap: 12px;
  }
  .header-left { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

  .title {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 26px;
    letter-spacing: -0.01em;
  }

  .count {
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    color: var(--text-2);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .sync-indicator {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-3);
    transition: background 0.3s;
  }
  .sync-indicator.online { background: var(--sync-online); box-shadow: 0 0 0 0 rgba(111, 207, 115, 0.4); animation: sync-pulse 2s infinite; }
  .sync-indicator.offline { background: var(--sync-offline); }
  @keyframes sync-pulse {
    0% { box-shadow: 0 0 0 0 rgba(111, 207, 115, 0.4); }
    70% { box-shadow: 0 0 0 6px rgba(111, 207, 115, 0); }
    100% { box-shadow: 0 0 0 0 rgba(111, 207, 115, 0); }
  }

  .settings-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .settings-btn:hover { background: var(--bg-hover); color: var(--text-1); border-color: var(--border-strong); }
  .settings-btn.open { background: var(--bg-hover); color: var(--text-1); }

  .settings-panel {
    position: absolute;
    top: 60px; right: 20px;
    background: #232323;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 4px;
    min-width: 220px;
    z-index: 20;
    display: none;
    flex-direction: column;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .settings-panel.open { display: flex; }
  .settings-item {
    padding: 9px 12px;
    background: transparent; border: none;
    color: var(--text-1);
    font-family: inherit; font-size: 13px;
    text-align: left; cursor: pointer;
    border-radius: 4px;
    transition: background 0.1s;
    display: flex; align-items: center; gap: 10px;
  }
  .settings-item:hover { background: var(--bg-hover); }
  .settings-item.danger { color: var(--danger); }
  .settings-item.danger:hover { background: rgba(224, 108, 117, 0.1); }
  .settings-item.confirming { background: var(--danger); color: #1a1a1a; font-weight: 500; }

  .group { margin-bottom: 16px; }
  .group:last-of-type { margin-bottom: 8px; }

  .group-label {
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px;
    color: var(--text-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
    padding: 0 12px;
  }
  .group.overdue .group-label { color: var(--prio-high); }
  .group.today .group-label { color: var(--accent-streak); }

  .todos { display: flex; flex-direction: column; }

  .todo {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    margin: 0 -12px;
    border-radius: 8px;
    transition: background 0.15s ease, opacity 0.35s ease, transform 0.35s ease, padding 0.35s ease, margin 0.35s ease, max-height 0.35s ease;
    max-height: 80px;
    overflow: hidden;
  }
  .todo:hover { background: var(--bg-hover); }

  .todo.removing {
    opacity: 0;
    transform: translateX(40px);
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    margin-top: 0;
    margin-bottom: 0;
    pointer-events: none;
  }

  .check {
    width: 22px; height: 22px;
    border-radius: 7px;
    border: 1.5px solid var(--border-strong);
    transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer;
    background: transparent;
  }
  .check:hover { border-color: var(--accent-done); }
  .check svg {
    width: 12px; height: 12px;
    stroke: #0E0E0E; stroke-width: 3;
    stroke-linecap: round; stroke-linejoin: round;
    fill: none; opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.5, 1.6, 0.4, 1);
  }
  .todo.checked .check { background: var(--accent-done); border-color: var(--accent-done); }
  .todo.checked .check svg { opacity: 1; transform: scale(1); }

  .todo-content { display: flex; flex-direction: column; min-width: 0; gap: 1px; }

  .todo-title {
    font-size: 14.5px;
    color: var(--text-1);
    display: flex; align-items: center; gap: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .todo-title-text {
    cursor: text;
    padding: 1px 4px; margin: -1px -4px;
    border-radius: 4px; outline: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }
  .todo-title-text:focus {
    background: rgba(255, 255, 255, 0.06);
    white-space: normal;
  }

  .prio-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .prio-dot.hoch { background: var(--prio-high); }
  .prio-dot.mittel { background: var(--prio-medium); }
  .prio-dot.niedrig { background: var(--prio-low); }

  .todo-meta {
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px;
    color: var(--text-3);
    letter-spacing: 0.03em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .todo-date {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--text-2);
    letter-spacing: 0.02em;
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .todo-date.overdue { color: var(--prio-high); font-weight: 500; }
  .todo-date.today { color: var(--accent-streak); }

  .add-btn {
    display: flex; align-items: center; gap: 14px;
    width: calc(100% + 24px);
    padding: 10px 12px; margin: 10px -12px 0;
    background: transparent; border: none;
    color: var(--text-3);
    font-size: 14px; font-family: inherit;
    cursor: pointer; border-radius: 8px;
    transition: all 0.15s ease; text-align: left;
  }
  .add-btn:hover { background: var(--bg-hover); color: var(--text-2); }
  .add-btn .plus {
    width: 22px; height: 22px;
    border-radius: 7px;
    border: 1.5px dashed var(--border-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--text-3);
  }

  .add-form {
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 12px;
    margin: 10px 0 0;
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .add-form input[type="text"],
  .add-form input[type="date"],
  .add-form select {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text-1);
    font-family: inherit; font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
    color-scheme: dark;
  }
  .add-form input[type="text"]:focus,
  .add-form input[type="date"]:focus,
  .add-form select:focus { border-color: var(--accent-done); }
  .add-form .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-form .row > * { flex: 1; min-width: 0; }
  .add-form .actions { display: flex; gap: 4px; justify-content: flex-end; margin-top: 2px; }
  .add-form button {
    background: transparent; border: none;
    color: var(--text-2); cursor: pointer;
    padding: 6px 12px; font-family: inherit; font-size: 13px;
    border-radius: 4px; transition: all 0.15s;
  }
  .add-form button.confirm { color: var(--accent-done); font-weight: 500; }
  .add-form button:hover { background: rgba(255, 255, 255, 0.05); }

  .empty {
    text-align: center;
    padding: 40px 0 24px;
    color: var(--text-3);
    font-size: 14px;
    font-family: 'Fraunces', serif;
    font-style: italic;
  }
  .empty .e-emoji {
    font-size: 32px; margin-bottom: 8px; opacity: 0.5;
  }

  .loading { text-align: center; padding: 40px 0; color: var(--text-3); font-size: 13px; }

  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: #232323;
    border: 1px solid var(--accent-done);
    color: var(--text-1);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .card { padding: 18px 16px 16px; margin: 4px auto; border-radius: 12px; }
    .title { font-size: 22px; }
    .add-form .row { flex-direction: column; }
    .settings-panel { right: 16px; top: 56px; min-width: 200px; }
    .todo { gap: 10px; padding: 10px; margin: 0 -10px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-left">
      <span class="title">To-Dos</span>
      <span class="count" id="count">0 offen</span>
    </div>
    <div class="header-right">
      <div class="sync-indicator" id="sync-indicator" title="Sync-Status"></div>
      <button class="settings-btn" id="settings-btn" aria-label="Einstellungen">⚙</button>
    </div>
  </div>
  <div class="settings-panel" id="settings-panel">
    <button class="settings-item" data-action="export">📤 Daten exportieren</button>
    <button class="settings-item" data-action="import">📥 Daten importieren</button>
    <button class="settings-item danger" data-action="reset">🗑 Alle Daten zurücksetzen</button>
  </div>
  <div id="main-content">
    <div class="loading">Lade Daten…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAot00pxNmylzEI-tBRsPpak5YwI-BbbuA",
  authDomain: "notion-widgets-14888.firebaseapp.com",
  databaseURL: "https://notion-widgets-14888-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "notion-widgets-14888",
  storageBucket: "notion-widgets-14888.firebasestorage.app",
  messagingSenderId: "537954094678",
  appId: "1:537954094678:web:34a6ffeb4766a73d96f5f7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const dataRef = ref(db, 'todos/main');

const LOCAL_KEY = 'todo-list-v1';
const CATEGORIES = ['Arbeit', 'Persönlich', 'Gesundheit', 'Haushalt', 'Finanzen', 'Sonstiges'];
const PRIORITIES = [
  { value: 'Hoch', class: 'hoch' },
  { value: 'Mittel', class: 'mittel' },
  { value: 'Niedrig', class: 'niedrig' }
];

const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const dateKey = (date = new Date()) =>
  date.getFullYear() + '-' +
  String(date.getMonth() + 1).padStart(2, '0') + '-' +
  String(date.getDate()).padStart(2, '0');

const parseDate = (str) => {
  if (!str) return null;
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
};

const daysFromToday = (str) => {
  if (!str) return Infinity;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = parseDate(str); target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
};

let data = { todos: [] };
let firstLoad = true;
let mainBuilt = false;

const setSyncIndicator = (status) => {
  const el = document.getElementById('sync-indicator');
  el.classList.remove('online', 'offline');
  if (status === 'online') { el.classList.add('online'); el.title = 'Sync aktiv'; }
  else if (status === 'offline') { el.classList.add('offline'); el.title = 'Sync-Fehler'; }
  else el.title = 'Verbinde…';
};

onValue(dataRef, (snapshot) => {
  const val = snapshot.val();
  setSyncIndicator('online');
  if (val && Array.isArray(val.todos)) {
    data = { todos: val.todos };
  } else if (firstLoad) {
    // Try localStorage fallback
    try {
      const local = localStorage.getItem(LOCAL_KEY);
      if (local) {
        const parsed = JSON.parse(local);
        data = { todos: Array.isArray(parsed.todos) ? parsed.todos : [] };
        saveData();
      } else {
        data = { todos: [] };
      }
    } catch (e) {
      data = { todos: [] };
    }
  }
  firstLoad = false;
  if (!mainBuilt) buildMainStructure();
  render();
}, (error) => {
  console.error('Firebase error:', error);
  setSyncIndicator('offline');
  try {
    const local = localStorage.getItem(LOCAL_KEY);
    if (local) data = JSON.parse(local);
  } catch (e) {}
  if (!mainBuilt) buildMainStructure();
  render();
  showToast('Offline-Modus: nutze lokale Daten');
});

const saveData = () => {
  set(dataRef, data).catch((err) => {
    console.error('Save failed:', err);
    setSyncIndicator('offline');
    showToast('Sync-Fehler');
  });
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } catch (e) {}
};

const addTodo = (title, priority, dueDate, category) => {
  title = (title || '').trim();
  if (!title) return false;
  data.todos.push({
    id: 'todo-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
    title,
    priority: priority || 'Mittel',
    dueDate: dueDate || null,
    category: category || 'Sonstiges',
    createdAt: Date.now()
  });
  saveData();
  return true;
};

const removeTodo = (id) => {
  data.todos = data.todos.filter(t => t.id !== id);
  saveData();
};

const renameTodo = (id, newTitle) => {
  newTitle = (newTitle || '').trim();
  if (!newTitle) return false;
  const t = data.todos.find(t => t.id === id);
  if (t && t.title !== newTitle) { t.title = newTitle; saveData(); return true; }
  return false;
};

const completeTodo = (id) => {
  // Visual: add removing class to animate out, then delete after animation
  const el = document.querySelector(`[data-todo-id="${id}"]`);
  if (el) {
    el.classList.add('checked');
    setTimeout(() => {
      el.classList.add('removing');
      setTimeout(() => removeTodo(id), 320);
    }, 180);
  } else {
    removeTodo(id);
  }
};

const groupTodos = () => {
  const groups = {
    overdue: { label: 'Überfällig', class: 'overdue', items: [] },
    today: { label: 'Heute', class: 'today', items: [] },
    tomorrow: { label: 'Morgen', class: '', items: [] },
    week: { label: 'Diese Woche', class: '', items: [] },
    later: { label: 'Später', class: '', items: [] },
    none: { label: 'Ohne Datum', class: '', items: [] }
  };
  data.todos.forEach(t => {
    const d = daysFromToday(t.dueDate);
    if (t.dueDate === null || t.dueDate === undefined) groups.none.items.push(t);
    else if (d < 0) groups.overdue.items.push(t);
    else if (d === 0) groups.today.items.push(t);
    else if (d === 1) groups.tomorrow.items.push(t);
    else if (d <= 7) groups.week.items.push(t);
    else groups.later.items.push(t);
  });
  // Sort within each group: priority desc, then date asc, then createdAt asc
  const prioOrder = { 'Hoch': 0, 'Mittel': 1, 'Niedrig': 2 };
  Object.values(groups).forEach(g => {
    g.items.sort((a, b) => {
      const pa = prioOrder[a.priority] ?? 1;
      const pb = prioOrder[b.priority] ?? 1;
      if (pa !== pb) return pa - pb;
      const da = a.dueDate || '9999-12-31';
      const db = b.dueDate || '9999-12-31';
      if (da !== db) return da.localeCompare(db);
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
  });
  return groups;
};

const formatDueDate = (dueDate) => {
  if (!dueDate) return '';
  const d = daysFromToday(dueDate);
  if (d < 0) return `${Math.abs(d)}d überfällig`;
  if (d === 0) return 'heute';
  if (d === 1) return 'morgen';
  if (d >= 2 && d <= 6) {
    const date = parseDate(dueDate);
    return date.toLocaleDateString('de-DE', { weekday: 'short' });
  }
  const date = parseDate(dueDate);
  return date.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
};

const getPrioClass = (priority) => {
  const p = PRIORITIES.find(p => p.value === priority);
  return p ? p.class : 'mittel';
};

function buildMainStructure() {
  document.getElementById('main-content').innerHTML = `
    <div id="groups-container"></div>
    <div id="add-row"></div>
  `;
  renderAddRow();
  mainBuilt = true;
}

function renderAddRow() {
  const row = document.getElementById('add-row');
  if (!row) return;
  row.innerHTML = `
    <button class="add-btn" id="add-trigger">
      <span class="plus">+</span>
      <span>Neue To-Do</span>
    </button>
  `;
  document.getElementById('add-trigger').addEventListener('click', () => {
    row.innerHTML = `
      <div class="add-form">
        <input type="text" id="new-title" placeholder="Was muss erledigt werden?" maxlength="100" autocomplete="off">
        <div class="row">
          <select id="new-priority">
            ${PRIORITIES.map(p => `<option value="${p.value}"${p.value === 'Mittel' ? ' selected' : ''}>${p.value}</option>`).join('')}
          </select>
          <input type="date" id="new-date">
          <select id="new-category">
            ${CATEGORIES.map(c => `<option value="${c}"${c === 'Sonstiges' ? ' selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="actions">
          <button id="add-cancel">Abbrechen</button>
          <button class="confirm" id="add-confirm">Hinzufügen</button>
        </div>
      </div>
    `;
    const input = document.getElementById('new-title');
    input.focus();
    const submit = () => {
      const title = input.value;
      const priority = document.getElementById('new-priority').value;
      const dueDate = document.getElementById('new-date').value || null;
      const category = document.getElementById('new-category').value;
      if (addTodo(title, priority, dueDate, category)) {
        renderAddRow();
      } else {
        input.focus();
      }
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      else if (e.key === 'Escape') renderAddRow();
    });
    document.getElementById('add-confirm').addEventListener('click', submit);
    document.getElementById('add-cancel').addEventListener('click', renderAddRow);
  });
}

const showToast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
};

const toggleSettings = (force) => {
  const panel = document.getElementById('settings-panel');
  const btn = document.getElementById('settings-btn');
  const open = force !== undefined ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  btn.classList.toggle('open', open);
};

const exportData = () => {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `todos-backup-${dateKey()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup heruntergeladen');
  toggleSettings(false);
};

const importData = () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!Array.isArray(imported.todos)) {
          showToast('Ungültige Datei');
          return;
        }
        data = { todos: imported.todos };
        saveData();
        showToast('Daten importiert');
      } catch (e) {
        showToast('Fehler beim Lesen');
      }
    };
    reader.readAsText(file);
  };
  input.click();
  toggleSettings(false);
};

const handleSettingsClick = (e) => {
  const btn = e.target.closest('.settings-item');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'export') exportData();
  else if (action === 'import') importData();
  else if (action === 'reset') {
    if (btn.classList.contains('confirming')) {
      data = { todos: [] };
      saveData();
      showToast('Daten zurückgesetzt');
      toggleSettings(false);
    } else {
      btn.classList.add('confirming');
      btn.textContent = 'Wirklich? Nochmal klicken';
      if (btn._timer) clearTimeout(btn._timer);
      btn._timer = setTimeout(() => {
        btn.classList.remove('confirming');
        btn.textContent = '🗑 Alle Daten zurücksetzen';
      }, 2500);
    }
  }
};

function render() {
  if (!mainBuilt) return;
  const total = data.todos.length;
  document.getElementById('count').textContent =
    total === 0 ? '–' : `${total} ${total === 1 ? 'offen' : 'offen'}`;

  const container = document.getElementById('groups-container');
  container.innerHTML = '';

  if (data.todos.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <div class="e-emoji">🌿</div>
        <div>Alles erledigt.</div>
      </div>
    `;
    return;
  }

  const groups = groupTodos();
  const order = ['overdue', 'today', 'tomorrow', 'week', 'later', 'none'];

  order.forEach(key => {
    const g = groups[key];
    if (g.items.length === 0) return;
    const groupEl = document.createElement('div');
    groupEl.className = 'group ' + (g.class || '');
    groupEl.innerHTML = `
      <div class="group-label">${g.label} · ${g.items.length}</div>
      <div class="todos" id="todos-${key}"></div>
    `;
    container.appendChild(groupEl);
    const todosContainer = groupEl.querySelector('.todos');
    g.items.forEach(t => {
      const dueLabel = formatDueDate(t.dueDate);
      const isOverdue = t.dueDate && daysFromToday(t.dueDate) < 0;
      const isToday = t.dueDate && daysFromToday(t.dueDate) === 0;
      const dateClass = isOverdue ? 'overdue' : (isToday ? 'today' : '');
      const showDateOnRight = key !== 'today' && key !== 'overdue';

      const el = document.createElement('div');
      el.className = 'todo';
      el.dataset.todoId = t.id;
      el.innerHTML = `
        <div class="check" data-action="complete">
          <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
        </div>
        <div class="todo-content">
          <div class="todo-title">
            <div class="prio-dot ${getPrioClass(t.priority)}" title="${esc(t.priority)}"></div>
            <span class="todo-title-text" contenteditable="true" spellcheck="false">${esc(t.title)}</span>
          </div>
          <div class="todo-meta">${esc(t.category)}${(isOverdue || isToday) && dueLabel ? ' · ' + esc(dueLabel) : ''}</div>
        </div>
        ${showDateOnRight && dueLabel ? `<div class="todo-date ${dateClass}">${esc(dueLabel)}</div>` : '<div></div>'}
      `;

      el.querySelector('[data-action="complete"]').addEventListener('click', (e) => {
        e.stopPropagation();
        completeTodo(t.id);
      });

      const titleEl = el.querySelector('.todo-title-text');
      titleEl.addEventListener('blur', () => {
        const newName = titleEl.textContent.trim();
        if (newName && newName !== t.title) renameTodo(t.id, newName);
        else titleEl.textContent = t.title;
      });
      titleEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
        if (e.key === 'Escape') { titleEl.textContent = t.title; titleEl.blur(); }
      });

      todosContainer.appendChild(el);
    });
  });
}

document.getElementById('settings-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleSettings();
});
document.getElementById('settings-panel').addEventListener('click', handleSettingsClick);
document.addEventListener('click', (e) => {
  if (!e.target.closest('.settings-panel') && !e.target.closest('.settings-btn')) {
    toggleSettings(false);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') toggleSettings(false);
});

setSyncIndicator('connecting');
// Re-render every minute to update relative date labels
setInterval(() => { if (mainBuilt) render(); }, 60000);
</script>
</body>
</html>
