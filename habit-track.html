<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Geist:wght@300..600&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-surface: rgba(255, 255, 255, 0.03);
    --bg-hover: rgba(255, 255, 255, 0.055);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text-1: rgba(255, 255, 255, 0.94);
    --text-2: rgba(255, 255, 255, 0.55);
    --text-3: rgba(255, 255, 255, 0.32);
    --accent-done: #FF8C42;
    --accent-streak: #FFA94D;
    --dot: rgba(255, 255, 255, 0.085);
    --danger: #E06C75;
  }

  html, body {
    background: #191919;
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    color: var(--text-1);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px 20px;
    max-width: 560px;
    margin: 16px auto;
  }

  .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }

  .date {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 26px;
    font-style: italic;
    letter-spacing: -0.01em;
  }

  .progress-text {
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    color: var(--text-2);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .progress-bar { height: 4px; background: var(--dot); border-radius: 2px; overflow: hidden; margin-bottom: 22px; }
  .progress-fill { height: 100%; background: var(--accent-done); border-radius: 2px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

  .habits { display: flex; flex-direction: column; }

  .habit {
    display: grid;
    grid-template-columns: 22px 1fr auto 48px 18px;
    gap: 14px;
    align-items: center;
    padding: 11px 12px;
    margin: 0 -12px;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .habit:hover { background: var(--bg-hover); }

  .check {
    width: 22px; height: 22px; border-radius: 7px;
    border: 1.5px solid var(--border-strong);
    transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer;
  }
  .habit.done .check { background: var(--accent-done); border-color: var(--accent-done); }
  .check svg {
    width: 12px; height: 12px;
    stroke: #0E0E0E; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    fill: none; opacity: 0; transform: scale(0.6);
    transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.5, 1.6, 0.4, 1);
  }
  .habit.done .check svg { opacity: 1; transform: scale(1); }

  .habit-name {
    font-size: 15px; font-weight: 400; color: var(--text-1);
    transition: color 0.15s ease;
    cursor: text;
    padding: 2px 6px; margin: -2px -6px;
    border-radius: 4px; outline: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .habit-name:focus { background: rgba(255,255,255,0.06); white-space: normal; }
  .habit.done .habit-name { color: var(--text-2); }

  .strip { display: flex; gap: 3px; }
  .strip-day {
    width: 6px; height: 14px; border-radius: 2px;
    background: var(--dot); transition: background 0.2s ease;
  }
  .strip-day.done { background: var(--accent-done); opacity: 0.72; }
  .strip-day.today:not(.done) { border: 1px solid var(--text-3); }

  .streak {
    font-family: 'Geist Mono', monospace; font-size: 13px;
    color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 3px; justify-content: flex-end;
  }
  .streak.active { color: var(--accent-streak); }

  .delete-btn {
    width: 18px; height: 18px; border-radius: 4px;
    background: transparent; border: none; color: var(--text-3);
    cursor: pointer; opacity: 0;
    transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease;
    display: flex; align-items: center; justify-content: center;
    padding: 0; font-family: inherit; font-size: 18px; line-height: 1;
  }
  .habit:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { color: var(--danger); background: rgba(224, 108, 117, 0.1); }

  .add-btn {
    display: flex; align-items: center; gap: 14px;
    width: calc(100% + 24px);
    padding: 10px 12px; margin: 4px -12px 0;
    background: transparent; border: none;
    color: var(--text-3);
    font-size: 14px; font-family: inherit;
    cursor: pointer; border-radius: 8px;
    transition: all 0.15s ease; text-align: left;
  }
  .add-btn:hover { background: var(--bg-hover); color: var(--text-2); }
  .add-btn .plus {
    width: 22px; height: 22px; border-radius: 7px;
    border: 1.5px dashed var(--border-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--text-3);
  }

  .add-input-wrap {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; margin: 4px -12px 0;
  }
  .add-input-wrap input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 7px 10px;
    color: var(--text-1); font-family: inherit; font-size: 14px;
    outline: none; transition: border-color 0.15s;
  }
  .add-input-wrap input:focus { border-color: var(--accent-done); }
  .add-input-wrap button {
    background: transparent; border: none;
    color: var(--text-2); cursor: pointer;
    padding: 6px 10px; font-family: inherit; font-size: 13px;
    border-radius: 4px; transition: all 0.15s;
  }
  .add-input-wrap button.confirm { color: var(--accent-done); font-weight: 500; }
  .add-input-wrap button:hover { background: rgba(255,255,255,0.05); }

  .chart-section {
    margin-top: 24px; padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .chart-label {
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px; color: var(--text-3);
    letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chart-stats { color: var(--text-2); font-variant-numeric: tabular-nums; }

  .chart { display: flex; align-items: flex-end; gap: 3px; height: 64px; margin-bottom: 8px; }
  .chart-bar {
    flex: 1; min-height: 2px;
    background: var(--dot);
    border-radius: 2px 2px 0 0;
    position: relative;
    transition: opacity 0.15s ease, background 0.2s ease;
  }
  .chart-bar.has-data { background: var(--accent-done); opacity: 0.5; }
  .chart-bar.has-data.partial-high { opacity: 0.75; }
  .chart-bar.has-data.full { opacity: 1; }
  .chart-bar.today { box-shadow: inset 0 -2px 0 var(--accent-streak); }
  .chart-bar:hover { opacity: 1 !important; }
  .chart-bar:hover::after {
    content: attr(data-tooltip);
    position: absolute; bottom: calc(100% + 6px); left: 50%;
    transform: translateX(-50%);
    background: #2A2A2A; color: var(--text-1);
    font-family: 'Geist Mono', monospace;
    font-size: 11px; padding: 5px 8px; border-radius: 4px;
    white-space: nowrap; pointer-events: none;
    border: 1px solid var(--border-strong); z-index: 10;
  }
  .chart-axis {
    display: flex; justify-content: space-between;
    font-family: 'Geist Mono', monospace;
    font-size: 10px; color: var(--text-3); letter-spacing: 0.05em;
  }

  .footer {
    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between;
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px; color: var(--text-3);
    letter-spacing: 0.06em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  .empty { text-align: center; padding: 16px 0; color: var(--text-3); font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="date" id="date">—</div>
    <div class="progress-text" id="progress-text">0 / 0</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="habits" id="habits"></div>
  <div id="add-habit-row"></div>

  <div class="chart-section">
    <div class="chart-label">
      <span>Letzte 30 Tage</span>
      <span class="chart-stats" id="chart-stats">Ø 0%</span>
    </div>
    <div class="chart" id="chart"></div>
    <div class="chart-axis">
      <span>vor 30 Tagen</span>
      <span>heute</span>
    </div>
  </div>

  <div class="footer">
    <span id="total-streak">Längste Streak: —</span>
    <span id="best-day">Bester Tag: —</span>
  </div>
</div>

<script>
const STORAGE_KEY = 'habit-tracker-v2';
const DEFAULT_HABITS = [
  { id: 'reinigen', name: 'Reinigen' },
  { id: 'duolingo', name: 'Duolingo' },
  { id: 'gym',      name: 'Sport / Gym' },
  { id: 'udemy',    name: '15 min Udemy' }
];

const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const dateKey = (date = new Date()) =>
  date.getFullYear() + '-' +
  String(date.getMonth() + 1).padStart(2, '0') + '-' +
  String(date.getDate()).padStart(2, '0');

const formatDate = () =>
  new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });

const slugify = (name) => {
  const base = name.toLowerCase()
    .replace(/[äöüß]/g, c => ({ä:'ae',ö:'oe',ü:'ue',ß:'ss'}[c]))
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');
  return base || ('h-' + Date.now());
};

let data = (() => {
  try {
    const v2 = localStorage.getItem(STORAGE_KEY);
    if (v2) return JSON.parse(v2);
    const v1 = localStorage.getItem('habit-tracker-v1');
    if (v1) {
      const old = JSON.parse(v1);
      return { habits: DEFAULT_HABITS.slice(), history: old.history || {} };
    }
  } catch (e) {}
  return { habits: DEFAULT_HABITS.slice(), history: {} };
})();

const saveData = () => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
};

const isDone = (habitId, key = dateKey()) =>
  (data.history[key] || []).includes(habitId);

const toggle = (habitId) => {
  const key = dateKey();
  if (!data.history[key]) data.history[key] = [];
  const idx = data.history[key].indexOf(habitId);
  if (idx === -1) data.history[key].push(habitId);
  else data.history[key].splice(idx, 1);
  saveData();
  render();
};

const addHabit = (name) => {
  name = (name || '').trim();
  if (!name) { renderAddRow(); return; }
  let id = slugify(name);
  if (data.habits.find(h => h.id === id)) id = id + '-' + Date.now();
  data.habits.push({ id, name });
  saveData();
  render();
};

const removeHabit = (id) => {
  data.habits = data.habits.filter(h => h.id !== id);
  Object.keys(data.history).forEach(k => {
    data.history[k] = data.history[k].filter(hId => hId !== id);
    if (data.history[k].length === 0) delete data.history[k];
  });
  saveData();
  render();
};

const renameHabit = (id, newName) => {
  newName = (newName || '').trim();
  if (!newName) return false;
  const h = data.habits.find(h => h.id === id);
  if (h) { h.name = newName; saveData(); return true; }
  return false;
};

const calcStreak = (habitId) => {
  let streak = 0;
  let d = new Date();
  if (!isDone(habitId, dateKey(d))) d.setDate(d.getDate() - 1);
  while (isDone(habitId, dateKey(d))) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
};

const last7Days = (habitId) => {
  const arr = [];
  for (let i = 6; i >= 0; i--) {
    const day = new Date();
    day.setDate(day.getDate() - i);
    arr.push({ done: isDone(habitId, dateKey(day)), today: i === 0 });
  }
  return arr;
};

const last30DayStats = () => {
  const arr = [];
  const total = data.habits.length;
  const validIds = new Set(data.habits.map(h => h.id));
  for (let i = 29; i >= 0; i--) {
    const day = new Date();
    day.setDate(day.getDate() - i);
    const key = dateKey(day);
    const list = data.history[key] || [];
    const done = list.filter(id => validIds.has(id)).length;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    arr.push({
      key, done, total, pct,
      today: i === 0,
      label: day.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })
    });
  }
  return arr;
};

function renderAddRow() {
  const row = document.getElementById('add-habit-row');
  row.innerHTML = `
    <button class="add-btn" id="add-trigger">
      <span class="plus">+</span>
      <span>Habit hinzufügen</span>
    </button>
  `;
  document.getElementById('add-trigger').addEventListener('click', () => {
    row.innerHTML = `
      <div class="add-input-wrap">
        <input type="text" id="new-habit-name" placeholder="Name des Habits…" maxlength="40" autocomplete="off">
        <button class="confirm" id="add-confirm">Hinzufügen</button>
        <button id="add-cancel">Abbrechen</button>
      </div>
    `;
    const input = document.getElementById('new-habit-name');
    input.focus();
    const submit = () => addHabit(input.value);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      else if (e.key === 'Escape') renderAddRow();
    });
    document.getElementById('add-confirm').addEventListener('click', submit);
    document.getElementById('add-cancel').addEventListener('click', renderAddRow);
  });
}

function render() {
  document.getElementById('date').textContent = formatDate();

  const validIds = new Set(data.habits.map(h => h.id));
  const todayList = (data.history[dateKey()] || []).filter(id => validIds.has(id));
  const total = data.habits.length;
  const done = todayList.length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  document.getElementById('progress-text').textContent = `${done} / ${total}`;
  document.getElementById('progress-fill').style.width = pct + '%';

  const container = document.getElementById('habits');
  container.innerHTML = '';

  if (data.habits.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Noch keine Habits. Füg unten den ersten hinzu.';
    container.appendChild(empty);
  } else {
    data.habits.forEach(h => {
      const isd = isDone(h.id);
      const streak = calcStreak(h.id);
      const days = last7Days(h.id);

      const el = document.createElement('div');
      el.className = 'habit' + (isd ? ' done' : '');
      el.innerHTML = `
        <div class="check" data-action="toggle">
          <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
        </div>
        <div class="habit-name" contenteditable="true" spellcheck="false">${esc(h.name)}</div>
        <div class="strip">${days.map(d =>
          `<div class="strip-day${d.done ? ' done' : ''}${d.today ? ' today' : ''}"></div>`
        ).join('')}</div>
        <div class="streak${streak > 0 ? ' active' : ''}">${
          streak > 0 ? `<span>🔥</span>${streak}` : '—'
        }</div>
        <button class="delete-btn" data-action="delete" aria-label="Habit löschen">×</button>
      `;

      el.querySelector('[data-action="toggle"]').addEventListener('click', () => toggle(h.id));
      el.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm(`"${h.name}" wirklich löschen?`)) removeHabit(h.id);
      });
      const nameEl = el.querySelector('.habit-name');
      nameEl.addEventListener('blur', () => {
        const newName = nameEl.textContent.trim();
        if (newName && newName !== h.name) {
          renameHabit(h.id, newName);
          render();
        } else {
          nameEl.textContent = h.name;
        }
      });
      nameEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); }
        if (e.key === 'Escape') { nameEl.textContent = h.name; nameEl.blur(); }
      });

      container.appendChild(el);
    });
  }

  const stats = last30DayStats();
  const chart = document.getElementById('chart');
  chart.innerHTML = '';
  stats.forEach(s => {
    const bar = document.createElement('div');
    bar.className = 'chart-bar';
    if (s.pct > 0) bar.classList.add('has-data');
    if (s.pct >= 60 && s.pct < 100) bar.classList.add('partial-high');
    if (s.pct === 100) bar.classList.add('full');
    if (s.today) bar.classList.add('today');
    const heightPct = s.pct > 0 ? Math.max(s.pct, 6) : 0;
    bar.style.height = heightPct + '%';
    bar.setAttribute('data-tooltip', `${s.label}: ${s.done}/${s.total} (${s.pct}%)`);
    chart.appendChild(bar);
  });

  const avg = stats.length > 0
    ? Math.round(stats.reduce((sum, s) => sum + s.pct, 0) / stats.length)
    : 0;
  document.getElementById('chart-stats').textContent = `Ø ${avg}%`;

  const bestStreak = Math.max(0, ...data.habits.map(h => calcStreak(h.id)));
  document.getElementById('total-streak').textContent =
    bestStreak > 0 ? `Längste Streak: ${bestStreak}` : 'Längste Streak: —';

  let best = { date: null, count: 0 };
  Object.entries(data.history).forEach(([k, list]) => {
    const validCount = list.filter(id => validIds.has(id)).length;
    if (validCount > best.count) best = { date: k, count: validCount };
  });
  if (best.date) {
    const [, m, d] = best.date.split('-');
    document.getElementById('best-day').textContent =
      `Bester Tag: ${parseInt(d)}.${parseInt(m)}. (${best.count}/${data.habits.length})`;
  } else {
    document.getElementById('best-day').textContent = 'Bester Tag: —';
  }
}

renderAddRow();
render();
setInterval(render, 60000);
</script>
</body>
</html>
