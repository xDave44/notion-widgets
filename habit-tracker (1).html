<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Geist:wght@300..600&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-surface: rgba(255, 255, 255, 0.03);
    --bg-hover: rgba(255, 255, 255, 0.055);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text-1: rgba(255, 255, 255, 0.94);
    --text-2: rgba(255, 255, 255, 0.55);
    --text-3: rgba(255, 255, 255, 0.32);
    --accent-done: #6FCF73;
    --accent-streak: #FFA94D;
    --dot: rgba(255, 255, 255, 0.085);
  }

  html, body {
    background: transparent;
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    color: var(--text-1);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px 20px;
    max-width: 560px;
    margin: 16px auto;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }

  .date {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 26px;
    font-style: italic;
    letter-spacing: -0.01em;
  }

  .progress-text {
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    color: var(--text-2);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .progress-bar {
    height: 4px;
    background: var(--dot);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 22px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent-done);
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .habits { display: flex; flex-direction: column; }

  .habit {
    display: grid;
    grid-template-columns: 22px 1fr auto 48px;
    gap: 14px;
    align-items: center;
    padding: 11px 12px;
    margin: 0 -12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
    user-select: none;
  }

  .habit:hover { background: var(--bg-hover); }

  .check {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 1.5px solid var(--border-strong);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .habit.done .check {
    background: var(--accent-done);
    border-color: var(--accent-done);
  }

  .check svg {
    width: 12px;
    height: 12px;
    stroke: #0E0E0E;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.5, 1.6, 0.4, 1);
  }

  .habit.done .check svg { opacity: 1; transform: scale(1); }

  .habit-name {
    font-size: 15px;
    font-weight: 400;
    color: var(--text-1);
    transition: color 0.15s ease;
  }

  .habit.done .habit-name { color: var(--text-2); }

  .strip { display: flex; gap: 3px; }

  .strip-day {
    width: 6px;
    height: 14px;
    border-radius: 2px;
    background: var(--dot);
    transition: background 0.2s ease;
  }

  .strip-day.done { background: var(--accent-done); opacity: 0.72; }
  .strip-day.today:not(.done) { border: 1px solid var(--text-3); }

  .streak {
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    color: var(--text-3);
    text-align: right;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 3px;
    justify-content: flex-end;
  }

  .streak.active { color: var(--accent-streak); }

  .footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px;
    color: var(--text-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="date" id="date">—</div>
    <div class="progress-text" id="progress-text">0 / 4</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="habits" id="habits"></div>
  <div class="footer">
    <span id="total-streak">Längste Streak: —</span>
    <span id="best-day">Bester Tag: —</span>
  </div>
</div>

<script>
const HABITS = [
  { id: 'reinigen', name: 'Reinigen' },
  { id: 'duolingo', name: 'Duolingo' },
  { id: 'gym',      name: 'Sport / Gym' },
  { id: 'udemy',    name: '15 min Udemy' }
];

const STORAGE_KEY = 'habit-tracker-v1';

const dateKey = (date = new Date()) =>
  date.getFullYear() + '-' +
  String(date.getMonth() + 1).padStart(2, '0') + '-' +
  String(date.getDate()).padStart(2, '0');

const formatDate = () =>
  new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });

let data = (() => {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { history: {} }; }
  catch (e) { return { history: {} }; }
})();

const saveData = () => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
};

const isDone = (habitId, key = dateKey()) =>
  (data.history[key] || []).includes(habitId);

const toggle = (habitId) => {
  const key = dateKey();
  if (!data.history[key]) data.history[key] = [];
  const idx = data.history[key].indexOf(habitId);
  if (idx === -1) data.history[key].push(habitId);
  else data.history[key].splice(idx, 1);
  saveData();
  render();
};

const calcStreak = (habitId) => {
  let streak = 0;
  let d = new Date();
  if (!isDone(habitId, dateKey(d))) d.setDate(d.getDate() - 1);
  while (isDone(habitId, dateKey(d))) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
};

const last7Days = (habitId) => {
  const arr = [];
  for (let i = 6; i >= 0; i--) {
    const day = new Date();
    day.setDate(day.getDate() - i);
    arr.push({ done: isDone(habitId, dateKey(day)), today: i === 0 });
  }
  return arr;
};

function render() {
  document.getElementById('date').textContent = formatDate();

  const todayList = data.history[dateKey()] || [];
  const total = HABITS.length;
  const done = todayList.length;
  const pct = Math.round((done / total) * 100);

  document.getElementById('progress-text').textContent = `${done} / ${total}`;
  document.getElementById('progress-fill').style.width = pct + '%';

  const container = document.getElementById('habits');
  container.innerHTML = '';
  HABITS.forEach(h => {
    const isd = isDone(h.id);
    const streak = calcStreak(h.id);
    const days = last7Days(h.id);

    const el = document.createElement('div');
    el.className = 'habit' + (isd ? ' done' : '');
    el.innerHTML = `
      <div class="check">
        <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
      </div>
      <div class="habit-name">${h.name}</div>
      <div class="strip">${days.map(d =>
        `<div class="strip-day${d.done ? ' done' : ''}${d.today ? ' today' : ''}"></div>`
      ).join('')}</div>
      <div class="streak${streak > 0 ? ' active' : ''}">${
        streak > 0 ? `<span>🔥</span>${streak}` : '—'
      }</div>
    `;
    el.addEventListener('click', () => toggle(h.id));
    container.appendChild(el);
  });

  const bestStreak = Math.max(0, ...HABITS.map(h => calcStreak(h.id)));
  document.getElementById('total-streak').textContent =
    bestStreak > 0 ? `Längste Streak: ${bestStreak}` : 'Längste Streak: —';

  let best = { date: null, count: 0 };
  Object.entries(data.history).forEach(([k, list]) => {
    if (list.length > best.count) best = { date: k, count: list.length };
  });
  if (best.date) {
    const [, m, d] = best.date.split('-');
    document.getElementById('best-day').textContent =
      `Bester Tag: ${parseInt(d)}.${parseInt(m)}. (${best.count}/${total})`;
  }
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
